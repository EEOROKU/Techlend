<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Tech lend</title>
        <link rel="stylesheet" href="../../style1.css">
        <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" />
        <link rel="icon" type="image/x-icon" href="../../img/logo_top.png">
        <script src="script.js"></script>
        <style>
            /* From Uiverse.io by SelfMadeSystem */ 
            .container {
                display:list-item;
                justify-content: center; /* Centers horizontally */
                align-items: center;     /* Centers vertically */
                cursor: pointer;
                padding-right: 46px;
            }

            .container input {
            display: none;
            }

            .container svg {
            overflow: visible;
            }

            .path {
            fill: none;
            stroke: white;
            stroke-width: 6;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke-dasharray 0.5s ease, stroke-dashoffset 0.5s ease;
            stroke-dasharray: 241 9999999;
            stroke-dashoffset: 0;
            }

            .container input:checked ~ svg .path {
            stroke-dasharray: 70.5096664428711 9999999;
            stroke-dashoffset: -262.2723388671875;
            }

             /* From Uiverse.io by DaniloMGutavo */ 
            .checkbox-container {
                display: flex;
                justify-content: center; 
                align-items: center ; /* This property centers items vertically */
                position: relative;
                gap: 10px;
                padding-bottom: 10px;
                margin-bottom: 12px;
                cursor: pointer;
                font-size: 16px;
                user-select: none;
            }

            .checkbox-container p {
                margin: 0;
            }

            .custom-checkbox {
            opacity: 0;
            cursor: pointer;
            height: 0;
            width: 0;
            }

            .checkmark {
            height: 25px;
            width: 25px;
            background-color: #eee;
            border-radius: 4px;
            transition: background-color 0.3s;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            }

            .checkmark:after {
            content: "";
            position:relative;
            display: none;
            left: 9px;
            top: 5px;
            width: 5px;
            height: 10px;
            border: solid white;
            border-width: 0 3px 3px 0;
            transform: rotate(45deg);
            }

            .custom-checkbox:checked ~ .checkmark {
            background-color: red;
            box-shadow: 0 3px 7px rgba(33, 150, 243, 0.3);
            }

            .custom-checkbox:checked ~ .checkmark:after {
            display: block;
            }

            @keyframes checkAnim {
            0% {
                height: 0;
            }

            100% {
                height: 10px;
            }
            }

            .custom-checkbox:checked ~ .checkmark:after {
            animation: checkAnim 0.2s forwards;
            }

            
            @media screen and (orientation: portrait){
                h4 {
                    color: white;
                }
                .container svg {
                    overflow: visible;
                }
                .checkbox-container {
                    gap: 0px;
                }
                #about-started label p {
                        padding-left: 10px;
                        font-size: 10px;
                }
            }

        </style>
    </head>
    <body>
        <section id="about-started">
            <h2 style="padding-top: 20px;">Have everything you need?</h2>
            <img src="../../img/laptop/INSPIRON/Inspiron 15 Laptop_1.avif" alt="">
            <h4>
                You have chosen to rent the Touch screen Laptop,
                Dell Inspiron 15 3000 for $15 for a day
            </h4>
            <section id="about-index" class="prodd"> 
                <div class="prod"> 
                <h3> Would you like to add protection to your plan for $5 ?</h3>
                <label class="checkbox-container">
                    <input class="custom-checkbox" type="checkbox" id="protectionCheckbox">
                    <span class="checkmark"></span>
                    <p>This covers any physical damage that occurs to the requested device</p>
                </label>
            </div> 
            </section>

            <h4>Please accept the terms and conditions below</h4>
            <label class="container">
                <p>Yes, I agree to the <a href="../../Terms&services.html">Terms of service.</a></p>
                <input  type="checkbox" id="myCheckbox">
                <svg viewBox="0 0 64 64" height="2em" width="2em"></svg>
                <input type="checkbox" id="myCheckbox">
                <script>
                    const protectionCheckbox = document.getElementById('protectionCheckbox');
                    const termsCheckbox = document.getElementById('myCheckbox');

                    function handleRedirect() {
                        if (protectionCheckbox.checked && termsCheckbox.checked) {
                            setTimeout(function() {
                                window.location.href = 'https://buy.stripe.com/aFadR88dXdEu3Ou30laZi0B';
                            }, 1000);
                        } else if (termsCheckbox.checked) {
                            setTimeout(function() {
                                window.location.href = 'https://buy.stripe.com/dR69C959CcTh5Ne6oo';
                            }, 1000);
                        }
                    }

                    termsCheckbox.addEventListener('change', handleRedirect);
                    protectionCheckbox.addEventListener('change', function() {
                        if (termsCheckbox.checked) {
                            handleRedirect();
                        }
                    });
                </script>
                <svg viewBox="0 0 64 64" height="2em" width="2em">
                    <path d="M 0 16 V 56 A 8 8 90 0 0 8 64 H 56 A 8 8 90 0 0 64 56 V 8 A 8 8 90 0 0 56 0 H 8 A 8 8 90 0 0 0 8 V 16 L 32 48 L 64 16 V 8 A 8 8 90 0 0 56 0 H 8 A 8 8 90 0 0 0 8 V 56 A 8 8 90 0 0 8 64 H 56 A 8 8 90 0 0 64 56 V 16" pathLength="575.0541381835938" class="path"></path>
                </svg>
            </label>
        </section>
    </body>
</html>
